version: '3.8'

services:
  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hades-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - MONGODB_URI=${MONGODB_URI}
      - DATABASE_NAME=${DATABASE_NAME:-hades_db}
      - AUTH_SESSION_SECRET=${AUTH_SESSION_SECRET}
      - PAYMENT_TOKEN_CONTRACT=${PAYMENT_TOKEN_CONTRACT}
      - PAYMENT_RECEIVER_ADDRESS=${PAYMENT_RECEIVER_ADDRESS}
      - BSC_RPC_HTTP_URL=${BSC_RPC_HTTP_URL:-https://bsc-dataseed.binance.org}
    volumes:
      - ./logs:/app/logs
    networks:
      - hades-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - mongodb

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: hades-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=hades_db
    networks:
      - hades-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (opcional para producción)
  nginx:
    image: nginx:alpine
    container_name: hades-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - hades-network
    depends_on:
      - api
    profiles:
      - production

networks:
  hades-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
