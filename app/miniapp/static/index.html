<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HADES App</title>

  <!-- ═══════════════════════════════════════════════
       PWA — beforeinstallprompt DEBE capturarse lo antes posible,
       antes de cualquier otro script. Sin esto Chrome descarta el
       evento y solo ofrece "Añadir a pantalla de inicio" (acceso
       directo con badge). Con esto se activa el flujo de instalación
       real (sin badge, icono propio en launcher).
  ═══════════════════════════════════════════════ -->
  <script>
    // Captura inmediata — ANTES de que cargue nada más
    window.__pwaInstallPrompt = null;
    window.__pwaInstalled    = false;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); // Bloquea el mini-infobar automático de Chrome
      window.__pwaInstallPrompt = e;
      console.log('[PWA] beforeinstallprompt capturado ✓');
      // Mostrar banner cuando el DOM esté listo
      document.addEventListener('DOMContentLoaded', _showInstallBanner);
    });

    window.addEventListener('appinstalled', () => {
      window.__pwaInstalled    = true;
      window.__pwaInstallPrompt = null;
      _hideInstallBanner();
      console.log('[PWA] App instalada como PWA real ✓');
    });

    function _showInstallBanner() {
      const banner = document.getElementById('pwa-install-banner');
      if (banner) banner.classList.remove('pwa-banner--hidden');
    }
    function _hideInstallBanner() {
      const banner = document.getElementById('pwa-install-banner');
      if (banner) banner.classList.add('pwa-banner--hidden');
    }

    // Función global para triggear instalación desde cualquier lugar de app.js
    window.hadesInstallPWA = async function() {
      if (!window.__pwaInstallPrompt) return false;
      window.__pwaInstallPrompt.prompt();
      const { outcome } = await window.__pwaInstallPrompt.userChoice;
      console.log('[PWA] Respuesta usuario:', outcome);
      window.__pwaInstallPrompt = null;
      _hideInstallBanner();
      return outcome === 'accepted';
    };
  </script>

  <!-- ═══════════════════════════════════════════════
       PWA — Manifest & Theme
  ═══════════════════════════════════════════════ -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="HADES">

  <!-- ═══════════════════════════════════════════════
       PWA — iOS (Safari)
  ═══════════════════════════════════════════════ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HADES">
  <link rel="apple-touch-icon" href="/miniapp/static/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/miniapp/static/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/miniapp/static/icon-192x192.png">

  <!-- ═══════════════════════════════════════════════
       PWA — Windows / Microsoft
  ═══════════════════════════════════════════════ -->
  <meta name="msapplication-TileColor" content="#0a0a0f">
  <meta name="msapplication-TileImage" content="/miniapp/static/icon-144x144.png">

  <!-- ═══════════════════════════════════════════════
       SEO / Open Graph
  ═══════════════════════════════════════════════ -->
  <meta name="description" content="Trading signals y análisis de mercado cripto en tiempo real">
  <meta property="og:title" content="HADES App">
  <meta property="og:description" content="Trading signals y análisis de mercado cripto en tiempo real">
  <meta property="og:image" content="/miniapp/static/icon-512x512.png">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="/miniapp/static/icon-192x192.png">
  <link rel="shortcut icon" href="/miniapp/static/icon-192x192.png">

  <!-- Estilos y Telegram SDK -->
  <link rel="stylesheet" href="/miniapp/static/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- ═══════════════════════════════════════════════
       PWA Install Banner — estilos inline para que
       no dependan de que cargue app.css
  ═══════════════════════════════════════════════ -->
  <style>
    #pwa-install-banner {
      position: fixed;
      bottom: 80px; /* encima del bottom-nav */
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(139,92,246,0.1);
      max-width: calc(100vw - 32px);
      width: max-content;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #pwa-install-banner.pwa-banner--hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(20px);
    }
    #pwa-install-banner img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    #pwa-install-banner .pwa-banner-text {
      display: flex;
      flex-direction: column;
      line-height: 1.3;
    }
    #pwa-install-banner .pwa-banner-title {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.02em;
    }
    #pwa-install-banner .pwa-banner-sub {
      font-size: 11px;
      color: rgba(148, 163, 184, 0.8);
    }
    #pwa-install-banner .pwa-banner-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }
    #pwa-install-banner .pwa-banner-btn:active {
      opacity: 0.85;
    }
    #pwa-install-banner .pwa-banner-close {
      background: none;
      border: none;
      color: rgba(148,163,184,0.6);
      cursor: pointer;
      font-size: 16px;
      padding: 0 0 0 4px;
      flex-shrink: 0;
      line-height: 1;
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       Banner de instalación PWA real
       Solo aparece cuando Chrome dispara beforeinstallprompt
       (es decir, cuando SÍ puede instalarse como app nativa)
  ═══════════════════════════════════════════════ -->
  <div id="pwa-install-banner" class="pwa-banner--hidden" role="banner" aria-label="Instalar HADES como app">
    <img src="/miniapp/static/icon-192x192.png" alt="HADES">
    <div class="pwa-banner-text">
      <span class="pwa-banner-title">Instalar HADES</span>
      <span class="pwa-banner-sub">Acceso directo sin Chrome</span>
    </div>
    <button class="pwa-banner-btn" onclick="window.hadesInstallPWA()">Instalar</button>
    <button class="pwa-banner-close" onclick="document.getElementById('pwa-install-banner').classList.add('pwa-banner--hidden')" aria-label="Cerrar">✕</button>
  </div>

  <div id="app" class="app-shell">
    <div id="loading" class="loading-screen">
      <div class="spinner"></div>
      <div class="loading-text">Cargando HADES App...</div>
    </div>

    <header class="topbar">
      <div>
        <div class="eyebrow">HADES APP</div>
        <h1 id="titleMain">Dashboard</h1>
      </div>
      <div class="topbar-right">
        <span id="planBadge" class="plan-badge">FREE</span>
        <span id="daysBadge" class="days-badge">0 días</span>
      </div>
    </header>

    <main id="content" class="content hidden">
      <section id="view-home" class="view active"></section>
      <section id="view-signals" class="view"></section>
      <section id="view-market" class="view"></section>
      <section id="view-history" class="view"></section>
      <section id="view-account" class="view"></section>
      <section id="view-performance" class="view"></section>
      <section id="view-risk" class="view"></section>
      <section id="view-settings" class="view"></section>
      <section id="view-admin" class="view"></section>
    </main>

    <nav class="bottom-nav hidden" id="bottomNav">
      <button class="nav-item active" data-view="home">Inicio</button>
      <button class="nav-item" data-view="signals">Señales</button>
      <button class="nav-item" data-view="market">Mercado</button>
      <button class="nav-item" data-view="history">Historial</button>
      <button class="nav-item" data-view="account">Cuenta</button>
    </nav>
  </div>

  <template id="metricCardTemplate">
    <div class="card metric-card">
      <div class="metric-label"></div>
      <div class="metric-value"></div>
      <div class="metric-subtitle"></div>
    </div>
  </template>

  <div id="signalDetailModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-sheet">
      <div class="modal-header">
        <div>
          <div class="eyebrow">SIGNAL INTEL</div>
          <h2 id="signalDetailTitle">Detalle de señal</h2>
        </div>
        <button id="signalDetailClose" class="modal-close" aria-label="Cerrar">✕</button>
      </div>
      <div id="signalDetailBody" class="modal-body">
        <div class="empty-state">Selecciona una señal para ver su detalle.</div>
      </div>
    </div>
  </div>

  <!-- App principal -->
  <script src="/miniapp/static/app.js"></script>

  <!-- ═══════════════════════════════════════════════
       PWA — Registro del Service Worker
  ═══════════════════════════════════════════════ -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(reg => {
            console.log('[PWA] Service Worker registrado:', reg.scope);

            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[PWA] Nueva versión disponible — recarga para actualizar');
                }
              });
            });
          })
          .catch(err => console.warn('[PWA] Service Worker no disponible:', err));
      });
    }

    // Integración Telegram WebApp (bonus — para cuando se abre dentro de Telegram)
    window.addEventListener('load', () => {
      if (window.Telegram?.WebApp) {
        const tg = window.Telegram.WebApp;
        window.__hadesAddToHomeScreen = () => {
          try { tg.addToHomeScreen(); } catch(e) { /* API puede no estar disponible */ }
        };
      }
    });
  </script>
</body>
</html>
